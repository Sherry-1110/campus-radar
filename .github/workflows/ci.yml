name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Serialize production runs so deployments cannot overlap.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Deploy production to Cloudflare
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: eb3a1d8b71e4a281b95dfb386c0d06f8
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN repository Actions secret to enable deployment."
            exit 1
          fi
          ../../node_modules/.bin/wrangler deploy
      - name: Verify production
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          curl --fail --silent --show-error --retry 3 --retry-all-errors --max-time 30 \
            -H 'Sec-Fetch-Mode: navigate' https://campus-radar.com/ -o /tmp/campus-radar-live.html
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs'
          import assert from 'node:assert/strict'
          const expected = readFileSync('apps/web/dist/client/index.html', 'utf8')
          const actual = readFileSync('/tmp/campus-radar-live.html', 'utf8')
          const assets = [...expected.matchAll(/(?:src|href)="(\/assets\/[^"?]+)"/g)].map(match => match[1])
          assert.ok(assets.length, 'Build must contain versioned assets')
          for (const asset of assets) assert.ok(actual.includes(asset), `Live build is missing ${asset}`)
          JS
          echo "Deployed commit $GITHUB_SHA to https://campus-radar.com" >> "$GITHUB_STEP_SUMMARY"
