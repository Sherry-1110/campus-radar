name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Serialize production runs so deployments cannot overlap.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - name: Build web
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_GOOGLE_MAPS_MAP_ID: ${{ vars.VITE_GOOGLE_MAPS_MAP_ID }}
        run: |
          if [ -z "$VITE_GOOGLE_MAPS_API_KEY" ]; then
            echo "::warning::Production Maps is disabled: configure the VITE_GOOGLE_MAPS_API_KEY repository secret."
          fi
          npm run build
      - name: Deploy production to Cloudflare
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: eb3a1d8b71e4a281b95dfb386c0d06f8
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN repository Actions secret to enable deployment."
            exit 1
          fi
          ../../node_modules/.bin/wrangler deploy
      - name: Verify production
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs'
          import assert from 'node:assert/strict'
          import { setTimeout } from 'node:timers/promises'
          const expected = readFileSync('apps/web/dist/client/index.html', 'utf8')
          const assets = [...expected.matchAll(/(?:src|href)="(\/assets\/[^"?]+)"/g)].map(match => match[1])
          assert.ok(assets.length, 'Build must contain versioned assets')
          let verified = false
          for (let attempt = 1; attempt <= 12; attempt++) {
            try {
              const response = await fetch('https://campus-radar.com/', {
                headers: { 'Sec-Fetch-Mode': 'navigate', 'Cache-Control': 'no-cache' },
                signal: AbortSignal.timeout(30000),
              })
              assert.ok(response.ok, `Live site returned HTTP ${response.status}`)
              const actual = await response.text()
              verified = assets.every(asset => actual.includes(asset))
              if (verified) break
              console.log(`Waiting for deployed assets (${attempt}/12)`)
            } catch (error) { console.log(`Verification attempt ${attempt}/12: ${error.message}`) }
            if (attempt < 12) await setTimeout(5000)
          }
          assert.ok(verified, 'Live site did not serve the deployed build within the retry window')
          JS
          echo "Deployed commit $GITHUB_SHA to https://campus-radar.com" >> "$GITHUB_STEP_SUMMARY"
