name: Translate events to Chinese

# Fills Chinese titles and locations with DeepL Free after the nightly event sync; also runs by hand.
on:
  schedule:
    # An hour and a half after the nightly sync (08:17 UTC).
    - cron: '45 9 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: How many days ahead to translate
        default: '90'
      max_chars:
        description: Most DeepL characters this run may use (the free plan allows 500,000 a month)
        default: '100000'

permissions:
  contents: read

concurrency:
  group: translate-events
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Translate titles and locations
        working-directory: apps/ingestion/translate
        env:
          DAYS: ${{ inputs.days || '90' }}
          MAX_CHARS: ${{ inputs.max_chars || '100000' }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          SUPABASE_URL: https://lqirwngvveapraatpibe.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          if [ -z "$DEEPL_API_KEY" ]; then
            echo "::warning::Add the DEEPL_API_KEY repository secret to translate events into Chinese."
            exit 0
          fi
          python -m unittest test_translate
          python translate.py --days "$DAYS" --max-chars "$MAX_CHARS"
